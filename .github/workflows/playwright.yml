name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Build Next.js app for testing
      run: npm run build
    - name: Generate missing snapshots
      run: BASE_URL=http://localhost:3000 npx playwright test --update-snapshots=missing || true
    - name: Commit new snapshots
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add 'tests/**/*.png'
        git diff --cached --quiet || (git commit -m "ci: add missing linux playwright snapshots [skip ci]" && git push)
    - name: Run Playwright tests
      run: BASE_URL=http://localhost:3000 npx playwright test
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
