name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update Playwright snapshots'
        type: boolean
        default: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Build Next.js app for testing
      run: npm run build

    - name: Run Playwright tests
      run: BASE_URL=http://localhost:3000 npx playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}

    - name: Commit updated snapshots
      if: ${{ inputs.update_snapshots }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/canva.spec.ts-snapshots/
        git diff --staged --quiet || git commit -m "test: update Playwright snapshots"
        git push

    - uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: test-results
        path: test-results/
        retention-days: 7
