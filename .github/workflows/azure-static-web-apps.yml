name: Deploy to Azure Static Web Apps

# Separate from playwright.yml (tests) — this workflow only builds the static
# export and deploys it to the Azure Static Web App (resource group: neta-website).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'tests-unit/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: swa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build static export and deploy to Azure SWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      # Deploying without running these means a change that compiles but breaks
      # behaviour still ships to Azure.
      - name: Unit tests
        run: npm run test:unit

      - name: Build static export
        run: npm run build
        env:
          BUILD_STATIC_EXPORT: 'true'
          # POC: point OG/canonical tags at the Azure host so social previews work
          # on the *.azurestaticapps.net URL.
          #
          # ⚠ CUTOVER CHECKLIST — these two must change together:
          #   1. this NEXT_PUBLIC_SITE_URL -> https://www.netashemesh.co.il (or remove it)
          #   2. the "X-Robots-Tag" line in public/staticwebapp.config.json -> delete it
          #
          # While this points at the Azure host, every page canonicalises to
          # *.azurestaticapps.net. That is a full duplicate of production, so the
          # staticwebapp.config.json noindex header is what stops Google indexing
          # it. Removing one without the other either de-indexes the real site or
          # publishes a competing copy of it.
          NEXT_PUBLIC_SITE_URL: 'https://yellow-tree-0d5623803.7.azurestaticapps.net'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          app_location: 'out'      # pre-built static export
          output_location: ''      # no Oryx build — folder is already built
          skip_app_build: true
          skip_api_build: true
