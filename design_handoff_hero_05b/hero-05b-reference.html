<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero 05B — Dark Ground · Design Reference</title>
  <style>
    @font-face {
      font-family: 'Elamy';
      src: url('assets/Elamy-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Stanga';
      src: url('assets/stanga-bold-aaa.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e7e5df;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px;
      font-family: 'Stanga', sans-serif;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }
  </style>
</head>
<body>

  <!-- HERO 05B — 1280 × 820 -->
  <div style="
    width: 1280px;
    height: 820px;
    background: #574964;
    border-radius: 4px;
    box-shadow: 0 8px 34px rgba(87,73,100,.22);
    overflow: hidden;
    position: relative;
  ">

    <!-- ── NAV ── -->
    <div style="
      position: absolute; top: 0; right: 0; left: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 36px 60px;
      z-index: 2;
    ">
      <!-- Brand -->
      <div style="display:flex;align-items:center;gap:13px">
        <div style="
          width:44px;height:44px;border-radius:14px;
          background:#fff0e4;
          display:flex;align-items:center;justify-content:center;
          color:#574964;font-family:'Elamy',serif;font-size:21px;
        ">נ</div>
        <div style="font-family:'Elamy',serif;font-size:22px;color:#fff0e4">נטע שמש</div>
      </div>
      <!-- Nav links -->
      <div style="display:flex;gap:34px;font-size:16px;color:#C8AAAA">
        <a href="#" style="color:inherit;text-decoration:none">קצת עליי</a>
        <a href="#" style="color:inherit;text-decoration:none">התמחות</a>
        <a href="#" style="color:inherit;text-decoration:none">יצירת קשר</a>
      </div>
      <!-- Phone pill -->
      <div style="
        border: 1px solid #9F8383;
        color: #fff0e4;
        border-radius: 999px;
        padding: 11px 22px;
        font-size: 15px;
      "><span dir="ltr">050-123-4567</span></div>
    </div>

    <!-- ── CONTENT ── -->
    <div style="
      position: absolute;
      inset: 150px 60px 64px;
      display: flex;
      align-items: center;
      gap: 40px;
    ">

      <!-- Text block -->
      <div style="flex: 0 0 520px">

        <!-- Headline -->
        <div style="
          font-family: 'Elamy', serif;
          font-size: 64px;
          line-height: 1.16;
          color: #fff0e4;
        ">
          מקום בטוח
          <span style="position:relative;white-space:nowrap">לצמוח
            <!-- Highlight underline accent -->
            <span style="
              position:absolute;left:0;right:0;bottom:4px;
              height:10px;background:#C8AAAA;border-radius:6px;
              opacity:.55;transform:rotate(-1.2deg);z-index:-1;
            "></span>
          </span><br>בו, ביחד.
        </div>

        <!-- Body -->
        <div style="
          font-size: 19px;
          line-height: 1.75;
          color: #C8AAAA;
          max-width: 430px;
          margin-top: 24px;
        ">
          ליווי מקצועי בתהליכי שינוי, משבר וצמיחה — זוגית ומשפחתית.
          בואו נמצא יחד את הדרך חזרה אחד לשנייה.
        </div>

        <!-- CTAs -->
        <div style="display:flex;align-items:center;gap:18px;margin-top:36px">
          <button style="
            background: #fff0e4;
            color: #574964;
            padding: 16px 34px;
            border-radius: 999px;
            font-size: 17px;
            font-family: 'Stanga', sans-serif;
            border: none;
            cursor: pointer;
          ">לקביעת שיחת היכרות</button>
          <span style="color:#C8AAAA;font-size:17px;cursor:pointer">איך זה עובד ↗</span>
        </div>
      </div>

      <!-- Art block -->
      <div style="
        flex: 1;
        position: relative;
        height: 480px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
        <!-- Asymmetric blob -->
        <div style="
          position: absolute;
          width: 520px; height: 420px;
          background: #9F8383;
          opacity: .32;
          border-radius: 42% 58% 55% 45% / 55% 48% 52% 45%;
        "></div>
        <!-- Line-art illustration -->
        <img
          src="assets/couple3-cream.png"
          alt="זוג — ציור קו"
          style="width:480px;position:relative;animation:floaty 7s ease-in-out infinite"
        >
      </div>

    </div>
  </div>

</body>
</html>
